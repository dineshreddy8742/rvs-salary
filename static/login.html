<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RVS University Payroll & Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Anti-Inspect & DevTools Shield
    document.addEventListener('contextmenu', e => e.preventDefault(), { capture: true });
    document.addEventListener('keydown', e => {
      if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.ctrlKey && ['U','u','S','s'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.metaKey && e.altKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.metaKey && ['U','u','S','s'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
    }, { capture: true });
  </script>
  <style>
    :root {
      --primary-navy: #0f172a;
      --navy-card: rgba(15, 23, 42, 0.78);
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-focus: #38bdf8;
      --danger-red: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: var(--text-white);
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      width: 500px;
      height: 500px;
      top: -120px;
      left: -100px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.35) 0%, transparent 70%);
    }
    .glow-2 {
      width: 480px;
      height: 480px;
      bottom: -100px;
      right: -80px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
    }
    .glow-3 {
      width: 320px;
      height: 320px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--navy-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      animation: fadeInCard 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container {
      width: 78px;
      height: 78px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 25px -5px rgba(37, 99, 235, 0.4),
        0 0 0 2px rgba(255, 255, 255, 0.2);
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .univ-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .portal-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .alert-error {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 22px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 1.1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 13px 42px 13px 44px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.05rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: #cbd5e1;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 10px 25px -4px rgba(37, 99, 235, 0.65);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .security-badge {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .sec-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .sec-tag span.lock-ico {
      font-size: 0.85rem;
      color: #38bdf8;
    }

    .sec-sub {
      font-size: 0.7rem;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 22px;
      }
      .univ-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="brand-header">
        <div class="logo-container">
          <img src="rvs-logo.png" alt="RVS University Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%231e3a8a\' stroke-width=\'2\'><path d=\'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\'/><polyline points=\'9 22 9 12 15 12 15 22\'/></svg>'">
        </div>
        <h1 class="univ-title">RVS University – Chittoor</h1>
        <div class="portal-subtitle">
          <span>Faculty &amp; Staff Payroll Portal</span>
          <span class="live-badge">
            <span class="live-dot"></span> Secure
          </span>
        </div>
      </div>

      <div class="alert-error" id="login-error-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="login-error-msg">Invalid credentials. Access denied.</span>
      </div>

      <form id="login-form" autocomplete="off" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label class="form-label" for="username-input">Portal Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="username-input" 
              class="form-control" 
              placeholder="Enter portal username" 
              required 
              autofocus 
              spellcheck="false"
              autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password-input">Portal Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password-input" 
              class="form-control" 
              placeholder="Enter password" 
              required
              autocomplete="current-password">
            <button type="button" class="toggle-pwd-btn" id="btn-toggle-pwd" title="Show / Hide Password" onclick="togglePasswordVisibility()">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In to Dashboard</span>
          <span id="btn-arrow">→</span>
        </button>

      </form>

      <div class="security-badge">
        <div class="sec-tag">
          <span class="lock-ico">🛡️</span>
          <span>Restricted Access · Authorized Personnel Only</span>
        </div>
        <div class="sec-sub">
          All financial data, biometric logs &amp; banking records are strictly protected.
        </div>
      </div>

    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password-input');
      const toggleBtn = document.getElementById('btn-toggle-pwd');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        pwdInput.type = 'password';
        toggleBtn.textContent = '👁️';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');
      const errorBox = document.getElementById('login-error-box');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('btn-submit');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const btnArrow = document.getElementById('btn-arrow');

      errorBox.style.display = 'none';

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        errorMsg.textContent = 'Please enter both username and password.';
        errorBox.style.display = 'flex';
        return;
      }

      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Verifying...';
      btnArrow.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.status === 'success') {
          btnText.textContent = 'Success! Opening...';
          submitBtn.style.background = '#16a34a';
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.message || 'Invalid username or password.';
          errorBox.style.display = 'flex';
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Sign In to Dashboard';
          btnArrow.style.display = 'inline';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorBox.style.display = 'flex';
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In to Dashboard';
        btnArrow.style.display = 'inline';
      }
    }
  </script>
</body>
</html>
